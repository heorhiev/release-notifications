services:
  jira-release-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
    ports:
      - "${APP_PORT:-8082}:8080"
    volumes:
      - ./app:/app
    working_dir: /app
    command: php -S 0.0.0.0:8080 -t /app/public
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jira_release_bot}
      POSTGRES_USER: ${DB_USERNAME:-jira_release_bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jira_release_bot}
    ports:
      - "${DB_EXPOSE_PORT:-5433}:5432"
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jira_release_bot} -d ${DB_DATABASE:-jira_release_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: test
    environment:
      TEST_DB_DSN: pgsql:host=postgres-test;port=5432;dbname=jira_release_bot_test
      TEST_DB_USERNAME: jira_release_bot
      TEST_DB_PASSWORD: jira_release_bot
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles: [test]

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jira_release_bot_test
      POSTGRES_USER: jira_release_bot
      POSTGRES_PASSWORD: jira_release_bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira_release_bot -d jira_release_bot_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
    profiles: [test]
